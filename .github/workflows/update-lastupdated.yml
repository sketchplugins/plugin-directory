name: Update lastUpdated
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      backfill_limit:
        description: Number of legacy plugin records to backfill in this run
        required: false
        default: '25'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Ruby 3.1
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
    - name: Update lastUpdated
      run: |
        gem install octokit
        ruby -Itest test/plugin-recency-test.rb
        rake lastUpdated
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        BACKFILL_LIMIT: ${{ github.event.inputs.backfill_limit || '25' }}
    - name: push
      run: |
        git config --global user.name 'Sketch Developer'
        git config --global user.email 'developer@sketch.com'
        git add plugins.json
        git commit -am 'content: Update lastUpdated' --allow-empty
        git push
